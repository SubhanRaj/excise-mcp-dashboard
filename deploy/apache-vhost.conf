# Apache vhost for excise-mcp-dashboard on this box.
# Install to /etc/apache2/sites-available/excise-mcp-dashboard.conf and a2ensite it —
# OPERATOR_SETUP.md §Apache vhost has the full command sequence.
# Matches the pattern in ~/Sites/infra-notes/laravel-apps-deploy.md. Port 8084 is the next
# free one after the four existing apps (8080-8083); bound to 127.0.0.1 rather than the
# bare *:PORT the older sibling vhosts use, tightening the bind to match ufw's actual intent.

<VirtualHost 127.0.0.1:8084>
    ServerName visualizer.exciseup.in
    DocumentRoot /home/subhan/Sites/excise-mcp-dashboard/web/public

    # A compound Chat turn (several tool calls chained in one request) can run well
    # past the distro default of 300s. Scoped to this vhost: the shared
    # /etc/php/8.5/apache2/php.ini also serves the four sibling apps on this same
    # Apache instance (OPERATOR_SETUP.md §Apache PHP execution timeout).
    php_admin_value max_execution_time 1800

    # The shared php.ini's output_buffering=4096 holds each streamed chat event —
    # ChatController::send()'s own ob_flush()/flush() calls only flush PHP's buffer
    # into this one, so 15s heartbeat pings never actually reach the socket until it
    # fills. Through the Cloudflare Tunnel that reads as a dead connection well before
    # a real reply arrives; output_buffering is PHP_INI_PERDIR, so it can only be
    # turned off here, not with ini_set() in application code (OPERATOR_SETUP.md
    # §Apache PHP execution timeout).
    php_admin_value output_buffering 0

    <Directory /home/subhan/Sites/excise-mcp-dashboard/web/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/excise-mcp-dashboard-error.log
    CustomLog ${APACHE_LOG_DIR}/excise-mcp-dashboard-access.log combined
</VirtualHost>
