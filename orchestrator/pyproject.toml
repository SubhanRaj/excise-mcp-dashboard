[project]
name = "excise-orchestrator"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true  # asyncpg ships no py.typed marker; no stub package exists

[[tool.mypy.overrides]]
module = "sqlglot.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kaleido.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas.*", "matplotlib.*", "seaborn.*", "plotly.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
